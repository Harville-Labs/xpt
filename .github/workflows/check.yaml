name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run ty check
      - run: uv run pytest

  xdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest -n 4

  adapters:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv run --locked --group adapters pytest tests/adapters

  pytest-versions:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pytest: "8.0.2", xdist: "3.5.0" }
          - { pytest: "8.0.2", xdist: "3.8.0" }
          - { pytest: "8.1.2", xdist: "3.6.1" }
          - { pytest: "8.2.2", xdist: "3.8.0" }
          - { pytest: "8.3.5", xdist: "3.8.0" }
          - { pytest: "8.4.2", xdist: "3.8.0" }
          - { pytest: "9.0.3", xdist: "3.8.0" }
          - { pytest: "9.1.1", xdist: "3.8.0" }
          - { pytest: "9.2.0", xdist: "3.5.0" }
    name: pytest ${{ matrix.pytest }}, xdist ${{ matrix.xdist }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: >-
          uv run --isolated --no-dev
          --with pytest==${{ matrix.pytest }} --with pytest-xdist==${{ matrix.xdist }}
          --with hypothesis --with ruff
          python -m pytest -p no:sugar

  pytest-sugar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: >-
          uv run --isolated --no-dev --with pytest --with pytest-xdist --with pytest-sugar
          --with hypothesis python -m pytest -p no:sugar tests/test_report_compat.py
