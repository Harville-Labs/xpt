[project]
name = "xpt"
version = "0.0.0"
description = "Inline expect tests for Python, built for coding agents and the people reviewing their work."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Isaiah Harville" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 1 - Planning",
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Repository = "https://github.com/Harville-Labs/xpt"

[project.scripts]
xpt = "xpt.cli:main"

[project.entry-points.pytest11]
xpt = "xpt.pytest_plugin"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.14",
    "ty>=0.0.1a0",
    "hypothesis>=6",
    "pytest-xdist>=3.8.0",
]

[tool.ruff]
line-length = 100
extend-exclude = ["docs/prototypes", "bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.src]
exclude = ["docs/prototypes", "bench"]

[tool.ty.environment]
extra-paths = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers", "-p", "no:cacheprovider"]
