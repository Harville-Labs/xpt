[project]
name = "xpt"
version = "0.2.0"
description = "Inline expect tests for Python, built for coding agents and the people reviewing their work."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Isaiah Harville" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 1 - Planning",
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Documentation = "https://harville-labs.github.io/xpt/"
Repository = "https://github.com/Harville-Labs/xpt"

[project.scripts]
xpt = "xpt.cli:main"

[project.entry-points.pytest11]
xpt = "xpt.pytest_plugin"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
adapters = [
    "attrs>=26.1.0",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "protobuf>=7.36.2",
    "pydantic>=2.14.4",
    "torch>=2.15.0",
]
dev = [
    "pytest>=9",
    "ruff>=0.14",
    "ty>=0.0.1a0",
    "hypothesis>=6",
    "pytest-xdist>=3.8.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
extend-exclude = ["docs/prototypes", "bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.src]
exclude = ["docs/prototypes", "bench"]

[tool.ty.environment]
extra-paths = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers", "-p", "no:cacheprovider"]
